name: Build mobile web app

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build_webassembly_version:
    name: Build mobile web app
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Emscripten SDK
        run: |
          mkdir -p out/web
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git out/web/emsdk
          WEB_EMSCRIPTEN_VERSION="$(cat os/web/emscripten-version.txt)"
          python out/web/emsdk/emsdk.py install "$WEB_EMSCRIPTEN_VERSION"
          python out/web/emsdk/emsdk.py activate "$WEB_EMSCRIPTEN_VERSION"

      - name: SDL2 of the web build for audio conversion checks
        # The web mixer's test runs on the SDL release Emscripten's port builds
        # into the app: SDL2's resampler depends on how audio is fed to it, and
        # the distribution's SDL2 or an SDL3-based sdl2-compat differ.
        run: |
          SDL_TAG="$(python -c "import re; print(re.search(r\"TAG = '([^']+)'\", open('out/web/emsdk/upstream/emscripten/tools/ports/sdl2.py').read()).group(1))")"
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git out/web/sdl2-src
          cmake -S out/web/sdl2-src -B out/web/sdl2-build -DCMAKE_BUILD_TYPE=Release -DSDL_TEST=OFF -DCMAKE_INSTALL_PREFIX="$PWD/out/web/sdl2"
          cmake --build out/web/sdl2-build --parallel 4
          cmake --install out/web/sdl2-build
          echo "$PWD/out/web/sdl2/bin" >> "$GITHUB_PATH"

      - name: Node for storage tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install storage test dependency
        # Node's Web Locks implementation exercises actual exclusive leases.
        run: npm ci --prefix os/web --ignore-scripts --no-audit --no-fund

      - name: Test browser integration and local development server
        run: |
          python -m unittest discover -s os/web -p 'test_*.py'
          node --test os/web/test_*.mjs

      - name: Build engine and package current ce.dat
        run: python os/web/build.py --emsdk out/web/emsdk --jobs 4

      - name: Test asynchronous engine shutdown
        run: |
          python os/web/test_lifecycle.py
          python os/web/test_storage_runtime.py
          python os/web/test_user_saves.py
          node --test os/web/test_save_streams.mjs

      - name: Upload static app
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-mobile-web
          path: out/web/dist/
          if-no-files-found: error
          retention-days: 7
